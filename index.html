    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(-45deg, #000000, #232526, #414345, #888888);
            background-size: 400% 400%;
            animation: gradientBG 12s ease-in-out infinite;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        hr {
            border: none;
            height: 2px;
            background: hwb(57 4% 4%);
            margin: 24px auto;
            max-width: 900px;
        }

        .navbar {
            background-color: #f4c91f;
            overflow: hidden;
            width: 100%;
            margin: 0 0 24px 0;
            max-width: none;
            border-radius: 0;
            box-shadow: none;
        }

        .fade-in {
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1,
        p,
        .navbar a,
        footer,
        .fit-image {
            color: #fff !important;
        }

        .navbar a {
            float: left;
            display: block;
            color: #fff;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
            font-family: 'Montserrat', Arial, sans-serif;
            font-weight: 400;
            background: none;
            border-radius: 0;
            margin: 0;
            box-shadow: none;
            letter-spacing: 0.5px;
            transition: background 0.3s, color 0.3s;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: #333;
        }

        .fit-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .page-title {
            text-align: center;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        .intro-text {
            text-align: center;
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 1.1rem;
        }

        .site-footer {
            background: #222;
            color: #ffd700;
            padding: 24px 0;
            margin-top: 40px;
            border-top: 2px solid #ffd700;
            text-align: center;
        }

        .footer-content {
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .footer-link {
            color: #ffd700;
            margin: 0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-link i {
            line-height: 1;
        }

        .social-icons {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .social-icons a {
            font-size: 32px;
            text-decoration: none;
            transition: transform 0.3s;
            display: inline-flex;
        }

        .social-icons a:hover {
            transform: scale(1.2);
        }

        .fa-instagram {
            color: #E1306C;
        }

        .fa-youtube {
            color: red;
        }



        @media (max-width: 640px) {

            body,
            .page-title,
            .intro-text,
            .navbar a,
            .footer-content,
            .footer-link,
            .mobile-view-btn,
            .mobile-view-notice {
                font-family: 'Poppins', Arial, sans-serif;
            }

            .navbar {
                overflow: visible;
            }



            .navbar a {
                float: none;
                width: 100%;
                padding: 12px 10px;
                font-size: 15px;
            }

            .page-title {
                font-size: clamp(1.8rem, 8vw, 2.2rem);
                padding: 0 12px;
            }

            .intro-text {
                font-size: 1rem;
                padding: 0 14px;
            }

            .footer-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 1rem;
                line-height: 1.5;
                padding: 0 12px;
            }

            .social-icons {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                margin-top: 8px;
            }

            .social-icons a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: 24px;
                margin: 0;
            }
        }
    </style>
</head>

                        <i class="fa-brands fa-youtube"></i>
                        YouTube
                    </a>
                </span>
            </div>
        </footer>
    </div>
